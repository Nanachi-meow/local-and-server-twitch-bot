<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Оверлей алертов — Twitch-бот</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: transparent; overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start;
    padding-top: 6vh; gap: 18px;
  }
  .alert {
    display: flex; align-items: center; gap: 18px;
    padding: 18px 30px; border-radius: 18px;
    background: rgba(10, 8, 20, 0.82);
    border: 2px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 0 42px var(--glow, rgba(168, 85, 247, .55));
    color: #fff; text-shadow: 0 2px 8px rgba(0, 0, 0, .6);
    opacity: 0; transform: scale(.6) translateY(-16px);
    animation: pop-in .45s cubic-bezier(.2, 1.6, .4, 1) forwards;
    max-width: 82vw;
  }
  .alert.leaving { animation: pop-out .4s ease-in forwards; }
  @keyframes pop-in {
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes pop-out {
    to { opacity: 0; transform: scale(.85) translateY(-10px); }
  }
  .alert .emoji { font-size: 54px; line-height: 1; }
  .alert .text { font-size: 30px; font-weight: 700; letter-spacing: .3px; }
  .alert .text small { display: block; font-size: 16px; font-weight: 500; opacity: .75; }
  /* медиа алерта: картинка/gif/видео на месте эмодзи */
  .alert .media { max-height: 200px; max-width: 320px; width: auto; border-radius: 14px; }
  .alert .media video, .alert .media img { display: block; max-height: 200px; max-width: 320px; border-radius: 14px; }
  .k-follow  { --glow: rgba(168, 85, 247, .55); }
  .k-sub     { --glow: rgba(34, 197, 94, .55); }
  .k-resub   { --glow: rgba(236, 72, 153, .55); }
  .k-subgift { --glow: rgba(250, 204, 21, .5); }
  .k-raid    { --glow: rgba(59, 130, 246, .6); }
  .k-meme    { --glow: rgba(249, 115, 22, .6); }
  .k-wheel   { --glow: rgba(139, 92, 246, .65); }
  .k-redemption { --glow: rgba(234, 179, 8, .65); }
  /* список последних событий (Event List): правый верхний угол, полупрозрачный */
  #events {
    position: fixed; top: 16px; right: 16px;
    display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
    max-width: 420px; pointer-events: none;
  }
  #events .ev {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 12px; border-radius: 10px;
    background: rgba(10, 8, 20, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: #fff; font-size: 15px; font-weight: 600; letter-spacing: .2px;
    text-shadow: 0 1px 3px rgba(0, 0, 0, .8);
    max-width: 420px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    animation: ev-in .3s ease-out;
  }
  #events .ev .e-emoji { font-size: 17px; line-height: 1; }
  @keyframes ev-in { from { opacity: 0; transform: translateX(16px); } }
  #conn {
    position: fixed; left: 10px; bottom: 8px;
    font-size: 13px; color: rgba(255, 255, 255, .45);
    text-shadow: 0 1px 3px #000;
  }
  /* рулетка-колесо: canvas с секторами, стрелка, торможение, победитель */
  #wheel-widget {
    position: fixed; pointer-events: none;
    display: none; flex-direction: column; align-items: center; gap: 8px;
    z-index: 45;
  }
  #wheel-widget.on { display: flex; }
  #wheel-widget canvas { display: block; }
  #wheel-widget .wh-arrow {
    width: 0; height: 0; position: absolute; top: 50%;
    border-left: 16px solid transparent; border-right: 16px solid transparent;
    border-top: 26px solid #fff;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.6));
    transform: translateY(-50%);
  }
  #wheel-widget .wh-winner {
    font-size: 26px; font-weight: 700; color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,.8); white-space: nowrap;
  }
  /* виджет «Слово дня»: объектная раскладка (надпись/слово/счётчик/подложка/картинки) */
  .wod-obj { position: absolute; box-sizing: border-box; }
  .wod-obj-caption, .wod-obj-word, .wod-obj-count {
    color: #fff; font-weight: 700; text-shadow: 0 2px 8px rgba(0, 0, 0, .8);
    white-space: pre-wrap; overflow: hidden; display: flex; align-items: center;
  }
  .wod-obj-backdrop { background-size: 100% 100%; background-position: center; }
  .wod-obj-image { background-size: 100% 100%; background-position: center; }
  #wod-widget { position: fixed; width: 440px; height: 180px; pointer-events: none; }
  #wod-widget .wod-count.bump { animation: wod-bump .35s ease; }
  @keyframes wod-bump { 50% { transform: scale(1.35); } }

  /* виджет шатаута: объекты раскладки (аватар/текст/подложка/декор) */
  .so-obj { position: absolute; box-sizing: border-box; }
  .so-obj-avatar { overflow: hidden; background: rgba(10, 8, 20, .85); }
  .so-obj-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .so-obj-banner { overflow: hidden; background: rgba(10, 8, 20, .85); }
  .so-obj-banner img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .so-obj-text { color: #fff; font-weight: 700; text-shadow: 0 2px 8px rgba(0, 0, 0, .8); white-space: pre-wrap; overflow: hidden; display: flex; align-items: center; }
  .so-obj-backdrop { background-size: 100% 100%; background-position: center; }
  .so-obj-image { background-size: 100% 100%; background-position: center; }
  .so-obj-image img { width: 100%; height: 100%; display: block; }
  #so-widget { position: fixed; inset: 0; opacity: 0; transition: opacity .35s ease; pointer-events: none; }
  #so-widget.on { opacity: 1; }
  /* подсказка: браузер запретил автозвук до первого клика по странице */
  #mute-hint {
    position: fixed; left: 10px; bottom: 30px;
    font-size: 13px; color: rgba(255, 255, 255, .75);
    background: rgba(10, 8, 20, .7); border-radius: 8px; padding: 4px 10px;
    text-shadow: 0 1px 3px #000; cursor: pointer;
  }
  /* виджет «сейчас играет» — только надпись, звук живёт на /music */
  #sr-now {
    position: fixed; right: 24px; top: 84px;
    max-width: 40vw; padding: 10px 16px; border-radius: 12px;
    background: rgba(10, 8, 20, 0.72); border: 1px solid rgba(255,255,255,.12);
    font-size: 18px; font-weight: 600; text-shadow: 0 2px 6px rgba(0,0,0,.6);
    box-shadow: 0 0 22px rgba(139, 92, 246, .35);
  }
  #sr-now .sr-icon { margin-right: 4px; }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="sr-now" class="hidden"></div>
  <div id="events" hidden></div>
  <div id="mute-hint" class="hidden" title="включить звук видео">🔇 клик — включить звук видео</div>
  <div id="conn">…</div>
<script src="/sr-player.js"></script>
<script>
  const EMOJI = { follow: '💜', sub: '🎉', resub: '💖', subgift: '🎁', raid: '🚀', meme: '🎬', wheel: '🎡', redemption: '👑' };
  const SUBLINE = { follow: 'новый фолловер', sub: 'новая подписка', resub: 'продление подписки', subgift: 'подаренная подписка', raid: 'рейд на канал', meme: 'мем', wheel: 'колесо', redemption: 'награда канала' };
  const KINDS = ['follow', 'sub', 'resub', 'subgift', 'raid', 'meme', 'wheel', 'redemption'];  // громкость 0-100 → 0-1 (единая для звука алерта и звука видео)
  const vol = (v) => Math.max(0, Math.min(1, (Number(v) / 100))) || 0;
  const MEDIA_TYPE = (name) => {
    const ext = String(name || '').split('.').pop().toLowerCase();
    if (['mp4', 'webm', 'mov', 'm4v', 'ogv'].includes(ext)) return 'video';
    if (['mp3', 'wav', 'ogg', 'm4a', 'flac'].includes(ext)) return 'audio';
    return 'image'; // gif/apng/png/webp/jpg/jpeg/svg
  };
  let cfg = { enabled: true };
  const queue = [];
  let active = 0;
  const MAX_ACTIVE = 2;
  const params = new URLSearchParams(location.search);
  // ?tts=0 — полностью выключить озвучку на этой странице (для отладки/сцен)
  const TTS_OFF = params.get('tts') === '0';
  // ?events=1 — включить список событий на этой странице (иначе — настройка alerts.eventList)
  const EVENTS_URL = params.get('events') === '1';

  async function loadCfg() {
    try {
      const r = await fetch('/api/settings');
      const st = await r.json();
      cfg = st.alerts ?? { enabled: true };
      soCfg = st.shoutoutOverlay ?? soCfg;
    } catch {}
    applyEventListCfg();
    soRenderScene();
  }
  setInterval(loadCfg, 60_000);

  // ---------- Event List: список последних событий в углу ----------
  // питается ТЕМИ ЖЕ SSE-событиями, что и алерты (одно соединение /overlay/feed)
  let eventsOn = EVENTS_URL;
  let eventsSize = 5;

  function applyEventListCfg() {
    if (!EVENTS_URL) eventsOn = Boolean(cfg?.eventList?.enabled);
    const sz = Number(cfg?.eventList?.size);
    if (Number.isFinite(sz)) eventsSize = Math.max(1, Math.min(20, Math.floor(sz)));
    const box = document.getElementById('events');
    box.hidden = !eventsOn;
    while (box.children.length > eventsSize) box.lastChild.remove();
  }

  // короткая строка события: мем/колесо/награда несут готовый текст, остальные — кто пришёл
  function eventText(ev) {
    if (ev.kind === 'meme' || ev.kind === 'wheel' || ev.kind === 'redemption') return ev.text || '';
    let t = ev.user || ev.channel || '';
    if (ev.viewers) t += ` · ${ev.viewers} зрителей`;
    if (ev.months) t += ` · ${ev.months} мес.`;
    if (ev.recipient) t += ` → ${ev.recipient}`;
    return t;
  }

  function eventsPush(ev) {
    if (!eventsOn) return;
    const box = document.getElementById('events');
    const el = document.createElement('div');
    el.className = 'ev';
    el.innerHTML = `<span class="e-emoji">${EMOJI[ev.kind] || '✨'}</span><span class="e-text">${escapeHtml(eventText(ev))}</span>`;
    box.prepend(el);
    while (box.children.length > eventsSize) box.lastChild.remove();
    // старые строки затухают: прозрачность падает от 1 у свежей до ~0.2 у самой старой
    [...box.children].forEach((c, i) => { c.style.opacity = String(Math.max(0.2, 1 - i * 0.18)); });
  }
  applyEventListCfg();

  // ---------- TTS-озвучка (Web Speech API, конфиг alerts.tts) ----------
  let voices = [];
  function refreshVoices() {
    try { voices = window.speechSynthesis?.getVoices?.() ?? []; } catch {}
  }
  if ('speechSynthesis' in window) {
    refreshVoices();
    speechSynthesis.addEventListener?.('voiceschanged', refreshVoices);
  }
  function pickVoice() {
    if (cfg?.tts?.voiceName) {
      const exact = voices.find((v) => v.name === cfg.tts.voiceName);
      if (exact) return exact;
    }
    return voices.find((v) => /^ru/i.test(String(v.lang || ''))) ?? null; // дефолт — первый русский
  }
  // Несколько подряд фраз НЕ перебивают друг друга: браузер сам выстраивает
  // очередь из SpeechSynthesisUtterance при повторных вызовах speak().
  function speak(text) {
    if (TTS_OFF || !cfg?.tts?.enabled || !('speechSynthesis' in window) || !text) return;
    // анти-спам: кап очереди. При залпе мемов/рейдов браузер стекает фразы
    // безлимитно и оверлей обзванивает ВСЁ; если в ожидании уже > 3 фраз
    // (speechSynthesis.pending) — новую не ставим, пусть доспикит текущий хвост.
    if (Number(speechSynthesis.pending) > 3) return;
    try {
      const u = new SpeechSynthesisUtterance(String(text));
      const v = pickVoice();
      if (v) { u.voice = v; u.lang = v.lang || 'ru-RU'; }
      const rate = Number(cfg.tts.rate);
      const volume = Number(cfg.tts.volume);
      u.rate = Number.isFinite(rate) ? Math.max(0.5, Math.min(2, rate)) : 1;
      u.volume = Number.isFinite(volume) ? Math.max(0, Math.min(1, volume)) : 1;
      speechSynthesis.speak(u);
    } catch {}
  }

  function render(text, vars) {
    return String(text ?? '')
      .replace(/\{(\w+)\}/g, (_, k) => (vars[k] !== undefined && vars[k] !== null ? String(vars[k]) : ''));
  }

  function show(ev) {
    const kindCfg = cfg?.[ev.kind];
    if (!cfg?.enabled || kindCfg?.enabled === false) return;
    // мем/колесо/награда канала несут готовый текст (и, у мема, свой звук) прямо в событии
    const isInjected = ev.kind === 'meme' || ev.kind === 'wheel' || ev.kind === 'redemption';
    if (!isInjected && (!kindCfg?.enabled || !kindCfg?.template)) return;
    const vars = { channel: ev.channel, user: ev.user, viewers: ev.viewers, months: ev.months, recipient: ev.recipient };
    const text = isInjected ? (ev.text || '') : render(kindCfg.template, vars);
    if (!text) return;

    // медиа алерта (gif/картинка/видео) вместо эмодзи; аудиофайл в поле медиа = просто звук
    const mediaName = String(kindCfg?.media || '');
    let mediaHTML = `<div class="emoji">${EMOJI[ev.kind] || '✨'}</div>`;
    let mediaEl = null;
    if (mediaName) {
      const src = `/media/${encodeURIComponent(mediaName)}?t=${Date.now()}`;
      const type = MEDIA_TYPE(mediaName);
      if (type === 'video') {
        mediaHTML = `<div class="media"><video src="${src}" autoplay playsinline loop></video></div>`;
      } else if (type === 'image') {
        mediaHTML = `<div class="media"><img src="${src}" alt=""></div>`;
      } else {
        mediaHTML = ''; // аудио в поле медиа не показываем — играет ниже как звук
      }
    }

    const el = document.createElement('div');
    el.className = `alert k-${ev.kind}`;
    el.innerHTML = `${mediaHTML}
      <div class="text">${escapeHtml(text)}<small>${SUBLINE[ev.kind] || ''}${ev.channel ? ` · #${escapeHtml(ev.channel)}` : ''}</small></div>`;
    document.getElementById('stage').appendChild(el);
    active += 1;

    if (mediaName) {
      mediaEl = el.querySelector('video');
      if (mediaEl) {
        const v = vol(kindCfg?.soundVolume ?? 85);
        mediaEl.dataset.wantVol = String(v); // целевая громкость — пригодится после «разрешения звука»
        mediaEl.muted = v <= 0;
        mediaEl.volume = Math.max(0.001, v);
        if (v > 0 && !userInteracted) {
          // браузер без клика по странице не даёт автозвук: играем тихо и подсказываем
          mediaEl.play().catch(() => {
            mediaEl.muted = true;
            mediaEl.play().catch(() => {});
            showMuteHint();
          });
        } else {
          mediaEl.play().catch(() => { mediaEl.muted = true; mediaEl.play().catch(() => {}); });
        }
      }
    }

    const sound = (isInjected && ev.sound) || kindCfg?.sound || '';
    if (sound) {
      try {
        const a = new Audio(`/media/${encodeURIComponent(sound)}?t=${Date.now()}`);
        a.volume = vol(kindCfg?.soundVolume ?? 85) || 0.001;
        a.play().catch(() => {});
      } catch {}
    }
    // озвучка текстом алерта (без мелкой подписи); очередь — средствами браузера
    speak(text);
    const ms = Math.max(2, Math.min(20, Number(kindCfg?.duration) || 5)) * 1000;
    setTimeout(() => {
      try { mediaEl?.pause(); } catch {}
      el.classList.add('leaving');
      setTimeout(() => { el.remove(); active -= 1; pump(); }, 420);
    }, ms);
  }

  function pump() {
    while (queue.length && active < MAX_ACTIVE) show(queue.shift());
  }

  // ---------- виджет шатаута: аватарка + текст по раскладке (как у плеера музыки) ----------
  let soCfg = { v: 1, duration: 10, objects: [] };
  const soWidget = document.createElement('div');
  soWidget.id = 'so-widget';
  document.body.appendChild(soWidget);
  const soNodes = new Map(); // id → DOM-узел
  let soHideTimer = null;
  let soEv = null; // текущий шатаут (аватар/текст)

  function soDefaultObjects() {
    // базовый шаблон (отредактирован стримером): подложка + круглая аватарка + текст ниже
    return [
      { id: 'backdrop-0', type: 'backdrop', x: 680, y: 280, w: 560, h: 260, opacity: 100, z: 1, color: '#0c0a19', radius: 20, image: '' },
      { id: 'avatar-0', type: 'avatar', x: 880, y: 330, w: 160, h: 160, opacity: 100, z: 3, radius: 80 },
      { id: 'text-0', type: 'text', x: 705, y: 540, w: 510, h: 194, opacity: 100, z: 4, color: '#ffffff', fontSize: 26, radius: 0 },
    ];
  }
  function soNormalize(raw) {
    const c = raw ?? {};
    if (Array.isArray(c.objects) && c.objects.length) {
      return {
        v: 1,
        duration: Math.max(2, Math.min(60, Number(c.duration) || 8)),
        objects: c.objects
          .filter((o) => o && ['avatar', 'banner', 'text', 'backdrop', 'image'].includes(o.type))
          .map((o) => ({
            id: String(o.id || `${o.type}-x`),
            type: o.type,
            x: Number(o.x) || 0, y: Number(o.y) || 0,
            w: Math.max(20, Number(o.w) || 300), h: Math.max(20, Number(o.h) || 300),
            opacity: Math.max(0, Math.min(100, Number(o.opacity ?? 100))),
            z: Math.max(0, Math.min(30, Number(o.z ?? 1))),
            image: String(o.image || ''),
            color: String(o.color || ''),
            radius: Math.max(0, Number(o.radius) || 0),
            fontSize: Math.max(10, Number(o.fontSize) || 22),
          })),
      };
    }
    return { v: 1, duration: Math.max(2, Math.min(60, Number(c.duration) || 8)), objects: soDefaultObjects() };
  }

  function soRenderScene() {
    soCfg = soNormalize(soCfg);
    const k = (window.innerWidth || 1920) / 1920;
    const key = JSON.stringify(soCfg.objects.map((o) => [o.id, o.type, o.image, o.z]));
    const orphan = soCfg.objects.some((o) => !soNodes.get(o.id));
    if (soRenderScene.key !== key || orphan) {
      soRenderScene.key = key;
      soWidget.innerHTML = '';
      soNodes.clear();
      const sorted = [...soCfg.objects].sort((a, b) => (a.z ?? 0) - (b.z ?? 0));
      for (const o of sorted) {
        const div = document.createElement('div');
        div.className = `so-obj so-obj-${o.type}`;
        if (o.type === 'avatar') div.innerHTML = '<img alt="">';
        if (o.type === 'banner') div.innerHTML = '<img alt="">';
        if (o.type === 'image' && o.image) div.innerHTML = `<img src="/media/${encodeURIComponent(o.image)}" alt="">`;
        soWidget.appendChild(div);
        soNodes.set(o.id, div);
      }
    }
    for (const o of soCfg.objects) {
      const div = soNodes.get(o.id);
      if (!div) continue;
      div.style.left = `calc(50% + ${Math.round((o.x - 960) * k)}px)`;
      div.style.top = `calc(50% + ${Math.round((o.y - 540) * k)}px)`;
      div.style.width = `${o.w * k}px`;
      div.style.height = `${o.h * k}px`;
      div.style.zIndex = String(o.z ?? 1);
      div.style.opacity = String(o.opacity / 100);
      if (o.borderWidth) div.style.border = `${o.borderWidth * k}px solid ${o.borderColor || '#8b5cf6'}`;
      if (o.type === 'avatar') {
        div.style.borderRadius = `${o.radius * k}px`;
        const img = div.querySelector('img');
        if (img && img.src !== (soEv?.avatar || '')) img.src = soEv?.avatar || '';
        if (!soEv?.avatar) div.style.backgroundColor = 'rgba(139, 92, 246, .25)'; // тест без аватарки
      } else if (o.type === 'banner') {
        div.style.borderRadius = `${o.radius * k}px`;
        const img = div.querySelector('img');
        if (img && img.src !== (soEv?.banner || '')) img.src = soEv?.banner || '';
        if (!soEv?.banner) div.style.backgroundColor = 'rgba(139, 92, 246, .18)'; // тест без баннера
      } else if (o.type === 'text') {
        div.style.color = o.color || '#ffffff';
        div.style.fontSize = `${o.fontSize * k}px`;
        div.style.borderRadius = `${o.radius * k}px`;
        if (div.dataset.text !== (soEv?.text || '')) {
          div.textContent = soEv?.text || '';
          div.dataset.text = soEv?.text || '';
        }
      } else if (o.type === 'backdrop') {
        div.style.borderRadius = `${o.radius * k}px`;
        if (o.image) {
          div.style.backgroundImage = `url("/media/${encodeURIComponent(o.image)}")`;
          div.style.backgroundColor = 'transparent';
        } else {
          div.style.backgroundImage = 'none';
          const m = String(o.color || '#0c0a19').match(/^#?([0-9a-f]{6})$/i);
          div.style.backgroundColor = m
            ? `rgba(${parseInt(m[1].slice(0, 2), 16)}, ${parseInt(m[1].slice(2, 4), 16)}, ${parseInt(m[1].slice(4, 6), 16)}, 1)`
            : (o.color || '#0c0a19');
        }
      } else if (o.type === 'image') {
        div.style.borderRadius = `${o.radius * k}px`;
      }
    }
  }

  function soShow(ev) {
    soEv = ev;
    soRenderScene();
    soWidget.classList.add('on');
    clearTimeout(soHideTimer);
    soHideTimer = setTimeout(() => {
      soWidget.classList.remove('on');
      soEv = null;
    }, Math.max(2, Number(soCfg.duration) || 10) * 1000);
  }

  // ---------- звук видео: браузер требует клик до первого автовоспроизведения со звуком ----------
  // в OBS Browser Source обычно можно и так; в обычном браузере — до первого клика глушим,
  // потом включаем всем играющим видео их целевую громкость
  let userInteracted = false;
  function showMuteHint() {
    const h = document.getElementById('mute-hint');
    if (h && userInteracted) return;
    if (h) h.classList.remove('hidden');
  }
  function unmuteAll() {
    document.querySelectorAll('#stage video').forEach((v) => {
      const want = Number(v.dataset.wantVol || 0);
      if (want > 0) { v.muted = false; v.volume = Math.max(0.001, want); }
    });
    document.getElementById('mute-hint')?.classList.add('hidden');
  }
  document.addEventListener('pointerdown', () => { userInteracted = true; unmuteAll(); }, { once: false });
  document.addEventListener('keydown', () => { userInteracted = true; unmuteAll(); }, { once: false });
  document.getElementById('mute-hint').addEventListener('click', unmuteAll);

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  const es = new EventSource('/overlay/feed');
  es.onopen = () => { document.getElementById('conn').textContent = ''; };
  es.onerror = () => { document.getElementById('conn').textContent = 'нет связи с ботом…'; };
  es.onmessage = (m) => {
    try {
      const ev = JSON.parse(m.data);
      if (ev.kind === 'sr') { window.srPlayer?.onEvent?.(ev); return; }
      if (ev.kind === 'shoutout') { soShow(ev); return; }
      if (ev.kind === 'wordofday') {
        if (Array.isArray(ev.objects)) wodCfg = wodNormalize({ enabled: ev.enabled, corner: ev.corner, objects: ev.objects });
        if (ev.corner) wodCfg.corner = ev.corner;
        if (ev.word !== undefined) wodEv = { word: ev.word || '', count: Number(ev.count) || 0 };
        wodRenderScene();
        return;
      }
      if (ev.kind === 'wheel' && Array.isArray(ev.sectors)) { whSpin(ev); return; }
      if (KINDS.includes(ev.kind)) {
        queue.push(ev);
        pump();
        eventsPush(ev);
      }
    } catch {}
  };

  // ---------- рулетка-колесо: оригинальный виджет, наш дизайн ----------
  const whWidget = document.createElement('div');
  whWidget.id = 'wheel-widget';
  whWidget.innerHTML = '<div class="wh-arrow" style="left:-6px;"></div><canvas></canvas><div class="wh-winner"></div>';
  document.body.appendChild(whWidget);
  const whCanvas = whWidget.querySelector('canvas');
  const whCtx = whCanvas.getContext('2d');
  const whWinner = whWidget.querySelector('.wh-winner');
  const whArrow = whWidget.querySelector('.wh-arrow');
  let whCfg = { x: 760, y: 340, size: 400, arrowAngle: 180, duration: 8, spinSound: '', winnerTemplate: '🏆 {user} → {label}' };
  let whSpinning = false;
  let whRAF = 0;

  function whHexA(color, alpha) {
    const m = String(color || '').match(/^#?([0-9a-f]{6})$/i);
    if (!m) return color;
    const n = m[1];
    return `rgba(${parseInt(n.slice(0, 2), 16)}, ${parseInt(n.slice(2, 4), 16)}, ${parseInt(n.slice(4, 6), 16)}, ${alpha ?? 1})`;
  }

  function whRenderScene() {
    const k = (window.innerWidth || 1920) / 1920;
    const W = whCfg.size * k;
    whWidget.style.left = `${whCfg.x * k - W / 2}px`;
    whWidget.style.top = `${whCfg.y * k - W / 2}px`;
    whCanvas.width = W;
    whCanvas.height = W;
    whWinner.style.fontSize = `${Math.max(16, whCfg.size * 0.065) * k}px`;
    // стрелка позиционируется по углу вокруг колеса (0=лево, 90=верх, 180=право, 270=низ)
    const a = ((Number(whCfg.arrowAngle) || 0) * Math.PI) / 180;
    const r = W / 2;
    const ax = r + Math.cos(a + Math.PI) * (r + 10); // наружу от центра по углу
    const ay = r + Math.sin(a + Math.PI) * (r + 10);
    whArrow.style.left = `${Math.round(ax - 16)}px`; // минус половина ширины (border 16+16=32)
    whArrow.style.top = `${Math.round(ay - 13)}px`;  // минус половина высоты (border 26)
    whArrow.style.transform = `rotate(${a + Math.PI / 2}rad)`; // носиком к центру
    whArrow.style.position = 'absolute';
  }

  function whDrawWheel(sectors, rotation) {
    const W = whCanvas.width;
    const R = W / 2;
    whCtx.clearRect(0, 0, W, W);
    const total = sectors.reduce((s, x) => s + (Number(x.weight) || 1), 0);
    let angle = rotation; // начать сверху, стрелка слева указывает на текущий сектор
    for (const s of sectors) {
      const span = (Number(s.weight) || 1) / total * Math.PI * 2;
      whCtx.beginPath();
      whCtx.fillStyle = s.color || '#8b5cf6';
      whCtx.moveTo(R, R);
      whCtx.arc(R, R, R, angle - Math.PI / 2, angle - Math.PI / 2 + span);
      whCtx.closePath();
      whCtx.fill();
      whCtx.strokeStyle = 'rgba(0,0,0,.35)';
      whCtx.lineWidth = 2;
      whCtx.stroke();
      // текст вдоль сектора
      if (span > 0.18) {
        const mid = angle - Math.PI / 2 + span / 2;
        const r = R * 0.62;
        whCtx.save();
        whCtx.translate(R + Math.cos(mid) * r, R + Math.sin(mid) * r);
        whCtx.rotate(mid + Math.PI / 2);
        whCtx.fillStyle = '#fff';
        whCtx.font = `700 ${Math.max(11, W * 0.036)}px 'Segoe UI', sans-serif`;
        whCtx.textAlign = 'center';
        whCtx.textBaseline = 'middle';
        whCtx.fillText(String(s.label).slice(0, 22), 0, 0);
        whCtx.restore();
      }
      angle += span;
    }
    // центр
    whCtx.beginPath();
    whCtx.arc(R, R, R * 0.14, 0, Math.PI * 2);
    whCtx.fillStyle = 'rgba(12,10,25,.9)';
    whCtx.fill();
    whCtx.strokeStyle = 'rgba(255,255,255,.25)';
    whCtx.stroke();
  }

  let whClickAcc = 0;
  function whTick(speed) {
    whClickAcc += speed;
    if (whClickAcc > 22 && whCfg.spinSound) {
      whClickAcc = 0;
      try {
        const a = new Audio(`/media/${encodeURIComponent(whCfg.spinSound)}?t=${Date.now()}`);
        a.volume = 0.5;
        a.play().catch(() => {});
      } catch {}
    }
  }

  function whSpin(ev) {
    const sectors = Array.isArray(ev.sectors) && ev.sectors.length ? ev.sectors : [];
    if (!sectors.length) return;
    whCfg = { ...whCfg, ...(ev.wheelCfg ?? {}) };
    whRenderScene();
    whWinner.textContent = '';
    whWidget.classList.add('on');
    cancelAnimationFrame(whRAF);
    whSpinning = true;

    const target = Number.isInteger(ev.index) ? ev.index : 0;
    const total = sectors.reduce((s, x) => s + (Number(x.weight) || 1), 0);
    // стрелка может быть в любом месте вокруг колеса (arrowAngle: 0=лево, 90=верх, 180=право, 270=низ)
    // сектор рисуется от угла стрелки: доворачиваем колесо так, чтобы сектор target оказался под стрелкой
    const arrowAngle = ((Number(whCfg.arrowAngle) || 0) * Math.PI) / 180;
    // сектор target занимает [centerFrac - halfFrac, centerFrac + halfFrac] круга
    let acc = 0;
    for (let i = 0; i < target; i++) acc += (Number(sectors[i].weight) || 1) / total;
    const halfFrac = (Number(sectors[target].weight) || 1) / total / 2;
    const centerFrac = acc + halfFrac;
    // колесо рисуется от угла -90° (верх). Сектор target находится на угле (centerFrac * 2π - π/2)
    // Стрелка на угле (arrowAngle + π) относительно центра колеса
    // Нужно: (rot + centerFrac * 2π - π/2) ≡ (arrowAngle + π) mod 2π
    // → rot = arrowAngle + π - centerFrac * 2π + π/2 = arrowAngle + 3π/2 - centerFrac * 2π
    const targetAngle = arrowAngle + 3 * Math.PI / 2 - centerFrac * Math.PI * 2;
    const fullSpins = Math.PI * 2 * 6; // 6 полных оборотов + доворот
    const finalAngle = fullSpins + (targetAngle % (Math.PI * 2));

    const t0 = performance.now();
    const DUR = 5200; // мс, ease-out
    const draw = (t) => {
      const p = Math.min(1, (t - t0) / DUR);
      const ease = 1 - Math.pow(1 - p, 3); // easeOutCubic
      const rot = finalAngle * ease;
      whDrawWheel(sectors, rot);
      whTick(Math.abs(rot - (draw.lastRot || 0)));
      draw.lastRot = rot;
      if (p < 1) {
        whRAF = requestAnimationFrame(draw);
      } else {
        whSpinning = false;
        whWinner.textContent = (whCfg.winnerTemplate || '🏆 {user} → {label}')
          .replaceAll('{user}', ev.user || '')
          .replaceAll('{label}', ev.label || sectors[target].label || '');
        setTimeout(() => {
          whWidget.classList.remove('on');
          whWinner.textContent = '';
        }, Math.max(3, Number(whCfg.duration) || 8) * 1000);
      }
    };
    draw.lastRot = 0;
    whRAF = requestAnimationFrame(draw);
  }

  async function whLoad() {
    try {
      const st = await fetch('/api/settings').then((r) => r.json());
      whCfg = { ...whCfg, ...(st.wheel?.overlay ?? {}) };
      whRenderScene();
    } catch {}
  }
  whLoad();
  // ---------- «Слово дня»: объектная раскладка; слово выбирает бот по частоте чата ----------
  const wodWidget = document.createElement('div');
  wodWidget.id = 'wod-widget';
  document.body.appendChild(wodWidget);
  const wodNodes = new Map();
  let wodCfg = { enabled: false, objects: [] };
  let wodEv = { word: '', count: 0 };
  let wodLastCount = 0;

  function wodDefaultObjects() {
    // компактная карточка 440×180: подложка + «Слово дня:» + слово + счётчик
    return [
      { id: 'backdrop-0', type: 'backdrop', x: 0, y: 0, w: 440, h: 180, opacity: 80, z: 1, color: '#0c0a19', radius: 18, rotate: 0, image: '', borderColor: '', borderWidth: 0 },
      { id: 'caption-0', type: 'caption', x: 20, y: 16, w: 300, h: 24, opacity: 85, z: 3, color: '#ffffff', text: 'Слово дня:', fontSize: 15, radius: 0, rotate: 0, borderColor: '', borderWidth: 0 },
      { id: 'word-0', type: 'word', x: 20, y: 46, w: 300, h: 52, opacity: 100, z: 4, color: '#ffffff', fontSize: 28, radius: 0, rotate: 0, borderColor: '', borderWidth: 0 },
      { id: 'count-0', type: 'count', x: 340, y: 54, w: 80, h: 44, opacity: 95, z: 4, color: '#ffffff', fontSize: 18, radius: 12, rotate: 0, borderColor: '', borderWidth: 0 },
    ];
  }

  function wodHexA(color, alpha) {
    const m = String(color || '').match(/^#?([0-9a-f]{6})$/i);
    if (!m) return color;
    const n = m[1];
    return `rgba(${parseInt(n.slice(0, 2), 16)}, ${parseInt(n.slice(2, 4), 16)}, ${parseInt(n.slice(4, 6), 16)}, ${Math.max(0, Math.min(1, alpha))}`;
  }

  function wodNormalize(raw) {
    const c = raw ?? {};
    const objects = (Array.isArray(c.objects) && c.objects.length
      ? c.objects.filter((o) => o && ['caption', 'word', 'count', 'backdrop', 'image'].includes(o.type))
      : wodDefaultObjects())
      .map((o, i) => ({
        id: o.id || `${o.type}-${i}`,
        type: o.type,
        x: Number(o.x) || 0, y: Number(o.y) || 0,
        w: Math.max(20, Number(o.w) || 300), h: Math.max(20, Number(o.h) || 120),
        opacity: Math.max(0, Math.min(100, Number(o.opacity ?? 100))),
        z: Math.max(0, Math.min(30, Number(o.z ?? 1))),
        image: String(o.image || ''),
        color: String(o.color || ''),
        text: String(o.text || ''),
        radius: Math.max(0, Number(o.radius) || 0),
        rotate: Math.max(-15, Math.min(15, Number(o.rotate) || 0)),
        fontSize: Math.max(10, Number(o.fontSize) || 22),
        borderColor: String(o.borderColor || ''),
        borderWidth: Math.max(0, Number(o.borderWidth) || 0),
      }));
    return {
      enabled: Boolean(c.enabled),
      corner: ['top-left', 'top-right', 'bottom-left', 'bottom-right'].includes(c.corner) ? c.corner : 'top-right',
      objects,
    };
  }

  function wodRenderScene() {
    const k = (window.innerWidth || 1920) / 1920;
    // маленький виджет 440×180 в углу сцены (с учётом масштаба источника OBS)
    const WW = 440 * k;
    const WH = 180 * k;
    const M = 24 * k;
    const corners = {
      'top-left': { left: M, top: M },
      'top-right': { right: M, top: M },
      'bottom-left': { left: M, bottom: M },
      'bottom-right': { right: M, bottom: M },
    };
    const pos = corners[wodCfg.corner] ?? corners['top-right'];
    wodWidget.style.left = pos.left !== undefined ? `${pos.left}px` : 'auto';
    wodWidget.style.right = pos.right !== undefined ? `${pos.right}px` : 'auto';
    wodWidget.style.top = pos.top !== undefined ? `${pos.top}px` : 'auto';
    wodWidget.style.bottom = pos.bottom !== undefined ? `${pos.bottom}px` : 'auto';
    wodWidget.style.width = `${WW}px`;
    wodWidget.style.height = `${WH}px`;
    wodWidget.style.overflow = 'visible';
    const key = JSON.stringify(wodCfg.objects.map((o) => [o.id, o.type, o.image, o.z]));
    const orphan = wodCfg.objects.some((o) => !wodNodes.get(o.id));
    const show = Boolean(wodCfg.enabled && wodEv.word);
    if (wodRenderScene.key !== key || orphan) {
      wodRenderScene.key = key;
      wodWidget.innerHTML = '';
      wodNodes.clear();
      const sorted = [...wodCfg.objects].sort((a, b) => (a.z ?? 0) - (b.z ?? 0));
      for (const o of sorted) {
        const div = document.createElement('div');
        div.className = `wod-obj wod-obj-${o.type}`;
        wodWidget.appendChild(div);
        wodNodes.set(o.id, div);
      }
    }
    for (const o of wodCfg.objects) {
      const div = wodNodes.get(o.id);
      if (!div) continue;
      div.style.display = show ? 'block' : 'none';
      div.style.left = `${Math.round(o.x * k)}px`;
      div.style.top = `${Math.round(o.y * k)}px`;
      div.style.width = `${o.w * k}px`;
      div.style.height = `${o.h * k}px`;
      div.style.zIndex = String(o.z ?? 1);
      div.style.opacity = String(o.opacity / 100);
      div.style.transform = o.rotate ? `rotate(${o.rotate}deg)` : '';
      if (o.borderWidth) div.style.border = `${o.borderWidth * k}px solid ${o.borderColor || '#8b5cf6'}`;
      if (o.type === 'caption') {
        div.style.color = o.color || '#ffffff';
        div.style.fontSize = `${o.fontSize * k}px`;
        if (div.textContent !== (o.text || 'Слово дня:')) div.textContent = o.text || 'Слово дня:';
      } else if (o.type === 'word') {
        div.style.color = o.color || '#ffffff';
        div.style.fontSize = `${o.fontSize * k}px`;
        if (div.textContent !== wodEv.word) div.textContent = wodEv.word;
      } else if (o.type === 'count') {
        div.style.color = o.color || '#ffffff';
        div.style.fontSize = `${o.fontSize * k}px`;
        div.style.borderRadius = `${o.radius * k}px`;
        div.className = `wod-obj wod-obj-count${wodEv.count !== wodLastCount && wodLastCount > 0 ? ' bump' : ''}`;
        if (div.textContent !== `×${wodEv.count}`) div.textContent = `×${wodEv.count}`;
      } else if (o.type === 'backdrop') {
        div.style.borderRadius = `${o.radius * k}px`;
        if (o.image) {
          div.style.backgroundImage = `url("/media/${encodeURIComponent(o.image)}")`;
          div.style.backgroundColor = 'transparent';
        } else {
          div.style.backgroundImage = 'none';
          div.style.backgroundColor = wodHexA(o.color || '#0c0a19', o.opacity / 100);
        }
      } else if (o.type === 'image' && o.image) {
        div.style.borderRadius = `${o.radius * k}px`;
        div.style.backgroundImage = `url("/media/${encodeURIComponent(o.image)}")`;
      }
    }
    wodLastCount = wodEv.count;
  }

  async function wodLoad() {
    try {
      const st = await fetch('/api/settings').then((r) => r.json());
      wodCfg = wodNormalize(st.wordOfDay);
      const { wod } = await fetch('/api/wordofday').then((r) => r.json());
      wodEv = { word: wod.word || '', count: Number(wod.count) || 0 };
      wodLastCount = wodEv.count;
      wodRenderScene();
    } catch {}
  }
  wodLoad();
  if (params.get('test')) {
    loadCfg().then(() => setTimeout(() => {
      const testEv = { kind: params.get('test'), channel: 'твой канал', user: 'ТестовыйЗритель', viewers: 42, months: 12, recipient: 'ТестовыйДруг' };
      show(testEv);
      eventsPush(testEv);
    }, 800));
  } else {
    loadCfg();
  }
</script>
</body>
</html>
