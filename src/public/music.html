<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Плеер музыки — Twitch-бот</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; }
  #sr-video { opacity: 0; width: 2px; height: 2px; position: fixed; left: -10px; top: -10px; pointer-events: none; }
  /* Кастомайз под себя свободно — эта страница нужна только для звука */
  #sr-now {
    position: fixed; left: 24px; bottom: 20px;
    max-width: 90vw; padding: 12px 18px; border-radius: 14px;
    background: rgba(10, 8, 20, 0.78); border: 2px solid rgba(255,255,255,.14);
    font-size: 26px; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,.6);
    box-shadow: 0 0 30px rgba(139, 92, 246, .5);
  }
  #sr-now .sr-icon { margin-right: 6px; }
  /* тумблер музыки: кликается прямо в OBS (браузер-источник принимает мышь) */
  #sr-toggle {
    position: fixed; right: 16px; top: 14px;
    display: flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 999px; cursor: pointer;
    background: rgba(10, 8, 20, 0.75); border: 1px solid rgba(255,255,255,.2);
    color: #fff; font-size: 15px; font-weight: 600; user-select: none;
  }
  #sr-toggle.off { opacity: .55; border-color: rgba(255,255,255,.12); }
  .hidden { display: none !important; }
</style>
</head>
<body data-sr-role="player">
  <div id="sr-video"></div>
  <div id="sr-now" class="hidden"></div>
  <div id="sr-toggle" title="включить/выключить заказы и воспроизведение музыки">🎵 <span id="sr-toggle-label"></span></div>
  <script src="/sr-player.js"></script>
  <script>
    // music-страница слушает ту же шину SSE, что и оверлей
    const es = new EventSource('/overlay/feed');
    es.onmessage = (m) => {
      try { const ev = JSON.parse(m.data); window.srPlayer?.onEvent?.(ev); } catch {}
    };

    // тумблер музыки: клик прямо в OBS или в открытой странице
    const srToggle = document.getElementById('sr-toggle');
    const srToggleLabel = document.getElementById('sr-toggle-label');
    function renderSrToggle(enabled) {
      srToggleLabel.textContent = enabled ? 'музыка вкл' : 'музыка выкл';
      srToggle.classList.toggle('off', !enabled);
    }
    async function loadSrState() {
      try {
        const st = await fetch('/api/songs').then((r) => r.json());
        renderSrToggle(Boolean(st.enabled));
      } catch {}
    }
    loadSrState();
    srToggle.addEventListener('click', async () => {
      srToggle.style.pointerEvents = 'none';
      try {
        const s = await fetch('/api/songs').then((r) => r.json());
        const next = !s.enabled;
        await fetch('/api/settings', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ songs: { enabled: next } }),
        });
        renderSrToggle(next);
      } catch {}
      srToggle.style.pointerEvents = '';
    });
  </script>
</body>
</html>
