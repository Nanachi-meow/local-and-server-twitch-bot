<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Плеер музыки — Twitch-бот</title>
<style>
  /* ═══════════════════════════════════════════════════════════════════
   *  Страница для OBS Browser Source — оверлей плеера музыки.
   *  Раскладка (объекты: видео, бегущая строка, подложка, свои картинки,
   *  позиции/размеры/прозрачность/слои) настраивается в панели бота:
   *  🎵 Музыка → «📐 Раскладка плеера».
   *  Видео и строка исчезают, когда ничего не играет (объекты с
   *  «прятать при простое»); декор остаётся.
   *  Контракт (события/API) — в player/README.md
   * ═══════════════════════════════════════════════════════════════════ */
  html, body {
    margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  #pl-stage { position: fixed; inset: 0; }
  .pl-hidden { visibility: hidden !important; }

  .pl-obj { position: absolute; box-sizing: border-box; }

  /* видео */
  .pl-obj-video { background: #000; overflow: hidden; }
  .pl-obj-video iframe { width: 100%; height: 100%; border: 0; display: block; }

  /* бегущая строка: без рамок, две копии текста = бесшовный круг */
  .pl-obj-marquee { overflow: hidden; white-space: nowrap; display: flex; align-items: center; }
  .pl-obj-marquee .pl-track { display: inline-flex; width: max-content; will-change: transform; animation: pl-run 30s linear infinite; }
  .pl-obj-marquee .pl-track.paused { animation-play-state: paused; }
  .pl-obj-marquee .pl-track span { padding-right: 64px; text-shadow: 0 2px 8px rgba(0, 0, 0, .75); }
  @keyframes pl-run { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  /* подложка и свои картинки */
  .pl-obj-backdrop { background-size: 100% 100%; background-position: center; }
  .pl-obj-image img { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
  <div id="pl-stage"></div>
<script>
  /**
   * Плеер музыки для OBS — чистый дисплей без кнопок, вся раскладка из панели.
   *   GET /api/songs  → { current, queue, paused, enabled, volume, nowTemplate, playerCfg }
   *   SSE /overlay/feed → { kind:'sr' | 'srtest', op:…, playerCfg } — применяется живьём
   *   POST /api/songs {op:'ended'} — трек закончился
   */
  (() => {
    const SCENE_W = 1920, SCENE_H = 1080;
    let yt = null;
    let cfg = { v: 2, objects: [] };
    let current = null;
    let nowTemplate = '♪ {title} — заказал {by}';
    let volume = 60;
    let enabled = true;
    let testing = false;
    let testingTitle = '';
    let pausedNow = false;
    let lastVideoId = null;
    let pendingPlayerCfg = null;

    const fmt = (sec) => `${Math.floor(sec / 60)}:${String(Math.round(sec % 60)).padStart(2, '0')}`;

    // ---------- дефолт и нормализация раскладки ----------
    function defaultObjects() {
      const W = 320, H = 180; // микро-экран 40% от 800
      return [
        { id: 'video-0', type: 'video', x: (SCENE_W - W) / 2, y: (SCENE_H - H) / 2, w: W, h: H, opacity: 100, z: 3, hideOnIdle: true },
        { id: 'marquee-0', type: 'marquee', x: SCENE_W / 2 - 224, y: (SCENE_H + H) / 2 + 12, w: 448, h: 38, opacity: 100, z: 4, hideOnIdle: true, color: '#ffffff', fontSize: 22, speed: 30 },
      ];
    }
    function normalizeCfg(raw) {
      const c = raw ?? {};
      if (Array.isArray(c.objects) && c.objects.length) {
        return {
          v: 2,
          objects: c.objects
            .filter((o) => o && ['video', 'marquee', 'backdrop', 'image'].includes(o.type))
            .map((o, i) => ({
              id: o.id || `${o.type}-${i}`,
              type: o.type,
              x: Number(o.x) || 0, y: Number(o.y) || 0,
              w: Math.max(20, Number(o.w) || 400), h: Math.max(20, Number(o.h) || 300),
              opacity: Math.max(0, Math.min(100, Number(o.opacity ?? 100))),
              z: Math.max(0, Math.min(30, Number(o.z ?? 1))),
              hideOnIdle: Boolean(o.hideOnIdle),
              image: String(o.image || ''),
              color: String(o.color || ''),
              radius: Math.max(0, Number(o.radius) || 0),
              fontSize: Math.max(10, Number(o.fontSize) || 22),
              speed: Math.max(5, Number(o.speed) || 30),
            })),
        };
      }
      return { v: 2, objects: defaultObjects() };
    }

    // ---------- рендер объектов ----------
    const stage = document.getElementById('pl-stage');
    const nodes = new Map(); // объект → DOM-узел (перестраиваем при смене списка)

    function hexA(color, alpha) {
      const m = String(color || '').match(/^#?([0-9a-f]{6})$/i);
      if (!m) return color;
      const n = m[1];
      return `rgba(${parseInt(n.slice(0, 2), 16)}, ${parseInt(n.slice(2, 4), 16)}, ${parseInt(n.slice(4, 6), 16)}, ${Math.max(0, Math.min(1, alpha))})`;
    }

    function renderScene() {
      // ноль координат — центр сцены: позиция считается от 50% + смещение.
      // даже если размер окна пришёл кривым, объекты не улетают в левый верхний угол
      const vw = window.innerWidth || document.documentElement.clientWidth || SCENE_W;
      const k = vw / SCENE_W;
      const key = JSON.stringify(cfg.objects.map((o) => [o.id, o.type, o.image, o.z]));
      // самозалечивание: если хоть один объект остался без узла (конфиг прилетел новым) — перестраиваем
      const orphan = cfg.objects.some((o) => !nodes.get(o.id));
      if (renderScene.key !== key || orphan) {
        renderScene.key = key;
        stage.innerHTML = '';
        nodes.clear();
        const sorted = [...cfg.objects].sort((a, b) => (a.z ?? 0) - (b.z ?? 0));
        for (const o of sorted) {
          const div = document.createElement('div');
          div.className = `pl-obj pl-obj-${o.type}`;
          if (o.type === 'video') {
            if (ytFrame) {
              // живой iframe переносим в новую сцену — плеер не умирает при перестройке
              div.appendChild(ytFrame);
            } else {
              const holder = document.createElement('div');
              holder.id = 'pl-video';
              div.appendChild(holder);
              ensureApi();
              tryMount();
            }
          } else if (o.type === 'marquee') {
            div.innerHTML = '<div class="pl-track paused"><span></span><span></span></div>';
          } else if (o.type === 'image' && o.image) {
            div.innerHTML = `<img src="/media/${encodeURIComponent(o.image)}" alt="">`;
          }
          stage.appendChild(div);
          nodes.set(o.id, div);
        }
      }
      // позиции/размеры/стили — каждый кадр события; СЦЕНА: x=960,y=540 — это «ноль» (центр)
      for (const o of cfg.objects) {
        const div = nodes.get(o.id);
        if (!div) continue;
        div.style.left = `calc(50% + ${Math.round((o.x - 960) * k)}px)`;
        div.style.top = `calc(50% + ${Math.round((o.y - 540) * k)}px)`;
        div.style.width = `${o.w * k}px`;
        div.style.height = `${o.h * k}px`;
        div.style.zIndex = String(o.z ?? 1);
        div.style.opacity = String(Math.max(0, Math.min(1, (Number(o.opacity ?? 100)) / 100)));
        if (o.borderWidth) div.style.border = `${o.borderWidth * k}px solid ${o.borderColor || '#8b5cf6'}`;
        if (o.type === 'video') {
          div.style.borderRadius = `${Math.max(6, Math.round(o.w * 0.055)) * k}px`;
        } else if (o.type === 'marquee') {
          div.style.color = o.color || '#ffffff';
          div.style.fontSize = `${(Number(o.fontSize) || 22) * k}px`;
          const track = div.querySelector('.pl-track');
          if (track) {
            track.style.animationDuration = `${Math.max(5, Number(o.speed) || 30)}s`;
            track.classList.toggle('paused', pausedNow);
          }
        } else if (o.type === 'backdrop') {
          div.style.borderRadius = `${Number(o.radius || 0) * k}px`;
          if (o.image) {
            div.style.backgroundImage = `url("/media/${encodeURIComponent(o.image)}")`;
            div.style.backgroundColor = 'transparent';
          } else {
            div.style.backgroundImage = 'none';
            div.style.backgroundColor = hexA(o.color || '#0c0a19', (Number(o.opacity ?? 100)) / 100);
          }
        } else if (o.type === 'image') {
          div.style.borderRadius = `${Number(o.radius || 0) * k}px`;
        }
        // «прятать при простое»: видео/строка исчезают, когда ничего не играет
        const idleHide = Boolean(o.hideOnIdle) && !(enabled && (current || testing));
        div.classList.toggle('pl-hidden', idleHide);
        if (idleHide && o.type === 'video') { try { yt?.stopVideo?.(); lastVideoId = null; } catch {} }
      }
    }

    // ---------- бегущая строка ----------
    function renderNow() {
      const src = testing
        ? { title: `🧪 Тест: ${testingTitle}`, by: 'плеер', author: '', duration: 0 }
        : current;
      for (const o of cfg.objects) {
        if (o.type !== 'marquee') continue;
        const track = nodes.get(o.id)?.querySelector('.pl-track');
        if (!track) continue;
        if (!src) continue; // текст не трогаем: объект скрыт при простое
        const text = nowTemplate
          .replaceAll('{title}', src.title || '')
          .replaceAll('{by}', src.byName || src.by || '')
          .replaceAll('{author}', src.author || '')
          .replaceAll('{duration}', fmt(src.duration || 0));
        const spans = track.querySelectorAll('span');
        spans[0].textContent = text;
        spans[1].textContent = text;
        track.classList.toggle('paused', pausedNow);
      }
      renderScene();
    }

    // ---------- YouTube ----------
    let apiLoading = false;
    let apiReady = false;
    let ytFrame = null; // iframe плеера — живёт в DOM и переносится при перестройках сцены

    function ensureApi() {
      if (apiLoading || apiReady) return;
      apiLoading = true;
      // обработчик ставим ДО вставки скрипта: из кэша он может выстрелить мгновенно
      window.onYouTubeIframeAPIReady = () => {
        apiReady = true;
        tryMount();
      };
      const tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(tag);
    }

    function tryMount() {
      if (!apiReady || yt || !document.getElementById('pl-video')) return;
      yt = new YT.Player('pl-video', {
        width: '100%', height: '100%',
        playerVars: { playsinline: 1, rel: 0, modestbranding: 1, controls: 0, disablekb: 1 },
        events: {
          onReady: () => {
            ytFrame = document.getElementById('pl-video'); // с этого момента iframe переносим сами
            renderNow();
            playCurrent();
          },
          onStateChange: (e) => {
            if (e.data === YT.PlayerState.ENDED && !testing && current) {
              fetch('/api/songs', {
                method: 'POST', headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ op: 'ended' }),
              }).then((r) => r.json()).catch(() => {});
            }
          },
        },
      });
    }

    function playCurrent() {
      if (!yt || !enabled) { try { yt?.stopVideo?.(); lastVideoId = null; } catch {} return; }
      const id = current?.id;
      if (!id && !testing) { try { yt?.stopVideo?.(); lastVideoId = null; } catch {} return; }
      if (testing) {
        if (!window.__plTestId) return;
        if (lastVideoId !== window.__plTestId) { yt.loadVideoById(window.__plTestId); lastVideoId = window.__plTestId; }
      } else if (id) {
        if (lastVideoId !== id) { yt.loadVideoById(id); lastVideoId = id; }
      } else return;
      yt.setVolume(volume);
      yt.playVideo();
    }

    function applyState() {
      if (pendingPlayerCfg) {
        cfg = normalizeCfg({ ...cfg, ...pendingPlayerCfg, v: 2 });
        pendingPlayerCfg = null;
      }
      renderScene();
      renderNow();
      playCurrent();
    }

    async function loadState() {
      try {
        const st = await fetch('/api/songs').then((r) => r.json());
        current = st.current ?? null;
        volume = Math.max(0, Math.min(100, Number(st.volume ?? 60)));
        nowTemplate = String(st.nowTemplate || nowTemplate);
        enabled = Boolean(st.enabled);
        pausedNow = Boolean(st.paused);
        if (st.playerCfg) cfg = normalizeCfg(st.playerCfg);
        applyState();
      } catch {}
    }

    // ---------- SSE ----------
    const es = new EventSource('/overlay/feed');
    es.onmessage = (m) => {
      try {
        const ev = JSON.parse(m.data);
        if (ev?.kind === 'sr') {
          volume = Math.max(0, Math.min(100, Number(ev.volume ?? volume)));
          nowTemplate = String(ev.nowTemplate || nowTemplate);
          current = ev.current ?? null;
          pausedNow = Boolean(ev.paused);
          testing = false;
          if (ev.playerCfg) pendingPlayerCfg = ev.playerCfg;
          if (ev.op === 'pause') { pausedNow = true; try { yt?.pauseVideo?.(); } catch {} renderNow(); return; }
          if (ev.op === 'resume') { pausedNow = false; try { yt?.playVideo?.(); } catch {} renderNow(); return; }
          if (ev.op === 'stop') { current = null; testing = false; try { yt?.stopVideo?.(); lastVideoId = null; } catch {} renderNow(); return; }
          applyState();
        } else if (ev?.kind === 'srtest') {
          volume = Math.max(0, Math.min(100, Number(ev.volume ?? volume)));
          if (ev.op === 'play') {
            testing = true; pausedNow = false; testingTitle = String(ev.title || 'тест');
            window.__plTestId = ev.id;
            ensureApi();
            renderScene();
            playCurrent();
            renderNow();
          } else if (ev.op === 'pause') { pausedNow = true; try { yt?.pauseVideo?.(); } catch {} renderNow(); }
          else if (ev.op === 'resume') { pausedNow = false; try { yt?.playVideo?.(); } catch {} renderNow(); }
          else if (ev.op === 'stop') { testing = false; window.__plTestId = null; try { yt?.stopVideo?.(); lastVideoId = null; } catch {} renderNow(); }
        }
      } catch {}
    };

    window.addEventListener('resize', renderScene);
    loadState();
    // CEF в OBS может поднять страницу раньше, чем источник получит финальный размер —
    // перерисуем раскладку ещё раз после кадра и через секунду
    requestAnimationFrame(() => renderScene());
    setTimeout(renderScene, 250);
    setTimeout(renderScene, 1000);
  })();
</script>
</body>
</html>
